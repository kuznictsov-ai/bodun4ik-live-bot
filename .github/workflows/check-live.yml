name: Check TikTok LIVE

on:
  workflow_dispatch:

  schedule:
    # Запуск кожні 5 хвилин, але не на початку години.
    # :02, :07, :12, :17, :22, :27, :32, :37, :42, :47, :52, :57
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tiktok-live-check
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # NODE.JS
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------
      # INSTALL
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm install --no-package-lock

      # ------------------------------------------------------
      # CHECK TIKTOK LIVE
      # ------------------------------------------------------

      - name: Check TikTok LIVE
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js

      # ------------------------------------------------------
      # SAVE STATE
      # ------------------------------------------------------

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Зберігаємо state, який створив index.js
          cp state.json /tmp/state.json

          # Отримуємо останній стан main
          git fetch origin main

          # Переходимо на актуальний main
          git reset --hard origin/main

          # Повертаємо свіжий state
          cp /tmp/state.json state.json

          # Додаємо state
          git add state.json

          # Якщо нічого не змінилося — завершуємо
          if git diff --cached --quiet; then
            echo "State has not changed."
            exit 0
          fi

          # Коміт
          git commit -m "chore: update TikTok LIVE state"

          # Відправляємо state назад
          git push origin HEAD:main
